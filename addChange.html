<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>刊登交換頁</title>
   <link rel="stylesheet" href="./src/assets/scss/_reset.scss">
   <link rel="stylesheet" href="./src/assets/scss/style.scss">
   <link rel="icon" type="image/png" href="spinix_favicon.jpg">
   <script src="https://kit.fontawesome.com/865a269d64.js" crossorigin="anonymous"></script>
</head>

<body id="addChange">

   <!-- header -------------------------------------------->
   <div id="headerApp" class=""></div>

   <section class="sec" id="addChange">
      <h1 class="page-title">刊登物品</h1>
      <a href="./market.html" class="back-page">返回</a>
      <div class="form-add-prod">
         <form action="" method="post" id="form-addchange">
            <!-- 上傳圖片 -->
            <div id="uploadImgApp"></div>

            
            <div class="form-flex">
               <span class="form-label-style form-control">
                  <label for="type" class="label-title">類型</label>
                  <select name="type" id="" required>
                     <option value="" disabled selected>請選擇物品的類型</option>
                     <option value="beyblade">陀螺本體</option>
                     <option value="blade">戰刃</option>
                     <option value="ratchet">固鎖</option>
                     <option value="bit">軸心</option>
                     <option value="others">其他</option>
                  </select>
               </span>
               <span class="form-prod-name form-label-style form-control">
                  <label for="title" class="label-title">物品名稱</label>
                  <input type="text" name="title" required>
               </span>
            </div>
            <div class=" form-prod-state form-label-style">
               <span class="label-title">物品狀況</span>
               <span class="form-state-opts">
                  <label for="new">
                     <input type="radio" name="condition" value="new" id="new" checked required>全新
                  </label>

                  <label for="good">
                     <input type="radio" name="condition" value="good" id="good">二手-狀態良好
                  </label>
                  <label for="fair">
                     <input type="radio" name="condition" value="fair" id="fair">二手-有瑕疵
                  </label>
               </span>
            </div>
            <div class="form-contact-info form-flex">
               <span class="form-label-style form-control">
                  <label for="city_id" class="label-title">所在縣市</label>
                  <select name="city_id" id="select-city" required>
                     <option value="" disabled selected>請選擇縣市</option>
                  </select>
               </span>
               <span class="form-label-style form-control">
                  <label for="district_id" class="label-title">行政區:</label>
                  <select name="district_id" id="select-district" required>
                     <option value="" disabled selected>請選擇行政區</option>
                  </select>
               </span>
               <span class="form-label-style form-control form-contact-info__input">
                  <label for="post_contact" class="label-title">聯絡資訊</label>
                  <input type="text" name="post_contact" required>
               </span>
            </div>
            <div class="form-want-item form-label-style form-control">
               <label for="want_item" class="label-title">期望交換物品<span>(選填)</span></label>
               <input type="text" name="want_item">
            </div>
            <div class="form-prod-info form-label-style form-control">
               <label for="description" class="label-title">對你想換出物品做簡單描述</label>
               <textarea name="description" required></textarea>
            </div>
            <div class="form-btn">
               <button type="reset" class="btnNoFill">全部清除</button>
               <button type="submit" class="btnFill">送出刊登</button>
            </div>
         </form>
      </div>
   </section>



   <!-- footer -------------------------------------------->
   <div id="footerApp"></div>
   <script src="/src/assets/js/public.js"></script>
   <script src="/src/assets/js/citySelector.js" type="module"></script>
   <script src="/src/assets/js/addchange.js" type="module"></script>

</body>

</html>
