<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>二手交換</title>
   <link rel="stylesheet" href="./src/assets/scss/_reset.scss">
   <link rel="stylesheet" href="./src/assets/scss/style.scss">
   <script src="https://kit.fontawesome.com/865a269d64.js" crossorigin="anonymous"></script>
</head>

<body>

   <!-- header -------------------------------------------->
   <div id="headerApp" class=""></div>

   <div class="market-hero">
      <div class="hero-info">
         <h1>二手交換區</h1>
         <p>找到想交換的陀螺、零件與配件， 和玩家一起打造你的最強組合。</p>
         <button type="button" class="btnFill btn-guide">
            <a href="#marketCardInfo">開始導覽</a>
         </button>
         <button type="button" class="btnFill btn-exchaunge">
            <a href="./addChange.html">建立交換</a>
         </button>
      </div>
   </div>

   <section id="marketFilter">
      <div class="filter-container">
         <form action="">
            <div class="filter">
               <label for="type">類型:</label>
               <select name="type" id="">
                  <option value="all">全部</option>
                  <option value="beyblade">陀螺本體</option>
                  <option value="blade">戰刃</option>
                  <option value="ratchet">固鎖</option>
                  <option value="bit">軸心</option>
                  <option value="other">其他</option>
               </select>
               <label for="city">縣市:</label>
               <select name="city" id="select-city">
                  <option value="">請選擇縣市</option>
                  <option value="基隆市">基隆市</option>
                  <option value="台北市">台北市</option>
                  <option value="新北市">新北市</option>
               </select>
               <label for="district">行政區:</label>
               <select name="district" id="select-district">
                  <option value="">請選擇行政區</option>
               </select>
            </div>
            <div class="sort">
               <span>排序:</span>
               <button type="button" class="btnNoFill" data-sort="newest">由新到舊</button>
               <button type="button" class="btnNoFill" data-sort="oldest">由舊到新</button>
               <button type="reset" class="btn-reset">
                  <i class="fa-solid fa-rotate-left"></i>
                  重設
               </button>
               <button type="button" class="btnFill">
                  <a href="./addChange.html">我要刊登</a>
               </button>
            </div>
            <div class="icon-sort">
               <button type="button" data-sort="newest">
                  <i class="fa-solid fa-caret-up"></i>
                  最新
               </button>
               <button type="button" data-sort="oldest">
                  <i class="fa-solid fa-caret-down"></i>
                  最舊
               </button>
               <button type="reset" class="btn-reset">
                  <i class="fa-solid fa-rotate-left"></i>
                  重設
               </button>
            </div>
         </form>
      </div>
   </section>

   <!-- 交換內容區 ----------------------------------------->
   <section id="marketCardInfo">
      <!-- 商品列表掛載點 -->
      <div id="exchangeApp"></div>
      <!-- 分頁器 ------------------------------------------>
      <div id="paginationApp"></div>
      <!-- 載入更多按鈕 ------------------------------------>
      <button type="button" class="btnNeutral" id="moreBtn">
         載入更多
         <i class="fa-solid fa-arrow-down"></i>
      </button>
   </section>

   <!-- footer -------------------------------------------->
   <div id="footerApp"></div>
   <script src="./src/assets/js/public.js"></script>
   <script src="./src/assets/js/market.js" type="module"></script>
</body>

</html>
